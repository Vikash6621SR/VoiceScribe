spring.application.name=voicescribe
server.port=8080

# MySQL - XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/procuve_speech_db
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ElevenLabs API key
elevenlabs.api.key=${ELEVEN_LABS_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.voicescribe=DEBUG
logging.level.org.springframework.web=INFO

# Include useful error details during local development
server.error.include-message=always
server.error.include-binding-errors=always
