spring.application.name=voicescribe

# Server port (uses the cloud platform's port)
server.port=${PORT:8080}

# MySQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/procuve_speech_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ElevenLabs API key
elevenlabs.api.key=${ELEVEN_LABS_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.voicescribe=INFO
logging.level.org.springframework.web=INFO

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
